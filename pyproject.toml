[tool.poetry]
name = "langchain-tag-agent"
version = "0.1.0"
description = "Table-Augmented Generation (TAG) in LangChain: query synthesis, guarded read-only SQL execution, LM semantic operators (filter, rank, map) run row-wise in Python, and answer generation, as a pipeline and as a create_agent ReAct agent. Compared against Text2SQL, Text2SQL + LM and RAG on a bundled TAG-Bench-style benchmark. Runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/langchain-tag-agent"
repository = "https://github.com/MartinCastroAlvarez/langchain-tag-agent"
documentation = "https://github.com/MartinCastroAlvarez/langchain-tag-agent#readme"
keywords = [
    "langchain",
    "table-augmented-generation",
    "tag",
    "text-to-sql",
    "sql-agent",
    "semantic-operators",
    "ai-agents",
    "sqlite",
    "sqlglot",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "tag_agent" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
tag-agent = "tag_agent.cli:main"
tag-agent-bench = "tag_agent.bench:main"

[tool.poetry.dependencies]
python = "^3.11"
langchain = ">=1.4.7,<2"
langchain-core = ">=1.7,<2"
langchain-ollama = ">=1.1,<2"
langgraph = ">=1.2.17,<2"
sqlglot = ">=30.24,<31"
pydantic = ">=2.10,<3"
langchain-anthropic = { version = ">=1.7,<2", optional = true }

[tool.poetry.extras]
anthropic = ["langchain-anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S608", "E501"]
"examples/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["tag_agent", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=tag_agent",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["tag_agent"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "tag_agent/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
